# Where every language toolchain and its packages live: all of it under
# ~/.langs, one directory per thing, nothing else in $HOME. This file is
# the one list: the desktop session reads it here (environment.d), fish
# loads it from conf.d/00-langs.fish and bash from .bashrc.
#
#   ~/.langs/mise        toolchains mise manages (go, node; ~/.config/mise/config.toml)
#   ~/.langs/go          GOPATH: module cache, `go install` binaries (go/bin)
#   ~/.langs/flutter     the Flutter SDK (a git checkout; `flutter upgrade`)
#   ~/.langs/jdk21       the JDK Android/Gradle builds use
#   ~/.langs/android     sdk/ (ANDROID_HOME) and .android/ (avds, adb keys)
#   ~/.langs/gradle      Gradle distributions and caches
#   ~/.langs/pub         Dart/Flutter packages
#   ~/.langs/choosenim   Nim toolchains (choosenim; `choosenim stable`)
#   ~/.langs/nimble      Nim packages and tools (nimble, nimlangserver);
#                        set in ~/.config/nimble/nimble.ini, not NIMBLE_DIR
#   ~/.langs/cargo       Rust (cargo, rustup) if it's ever installed
#
# Only ${HOME} and ${PATH} are expanded, and each value is used as is, so
# fish and bash can read this without a shell of their own.
MISE_DATA_DIR=${HOME}/.langs/mise
GOPATH=${HOME}/.langs/go
JAVA_HOME=${HOME}/.langs/jdk21
ANDROID_HOME=${HOME}/.langs/android/sdk
# Gradle and the emulator read ANDROID_USER_HOME; adb has no such setting
# and always uses ~/.android, so that's a symlink to the same directory
# (install.sh makes it).
ANDROID_USER_HOME=${HOME}/.langs/android/.android
GRADLE_USER_HOME=${HOME}/.langs/gradle
PUB_CACHE=${HOME}/.langs/pub
CHOOSENIM_DIR=${HOME}/.langs/choosenim
CARGO_HOME=${HOME}/.langs/cargo
# npm's download cache is a cache: ~/.cache with the others, not ~/.npm
NPM_CONFIG_CACHE=${HOME}/.cache/npm
RUSTUP_HOME=${HOME}/.langs/cargo/rustup
# mise's shims come first so its go/node win over any distro copy (an
# interactive fish replaces them with the project's own versions on cd).
PATH=${HOME}/.langs/mise/shims:${HOME}/.langs/go/bin:${HOME}/.langs/flutter/bin:${HOME}/.langs/nimble/bin:${HOME}/.langs/jdk21/bin:${HOME}/.langs/cargo/bin:${HOME}/.langs/android/sdk/platform-tools:${PATH}
