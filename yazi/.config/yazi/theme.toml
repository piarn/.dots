# yazi colors (the fixed palette).
[flavor]
dark  = ""
light = ""

[app]
overall = {}

# : Manager

[mgr]
cwd = { fg = "#bdbdbd" }

find_keyword  = { fg = "#c2a061", bold = true, italic = true, underline = true }
find_position = { fg = "#a08aad", bg = "reset", bold = true, italic = true }

symlink_target = { italic = true }

marker_copied   = { fg = "#e6e6e6", bg = "#e6e6e6" }
marker_cut      = { fg = "#c46a6a", bg = "#c46a6a" }
marker_marked   = { fg = "#7fa8a3", bg = "#7fa8a3" }
marker_selected = { fg = "#c2a061", bg = "#c2a061" }
marker_symbol   = "│"

count_copied   = { fg = "#0b0b0b", bg = "#bdbdbd" }
count_cut      = { fg = "#0b0b0b", bg = "#c46a6a" }
count_selected = { fg = "#0b0b0b", bg = "#c2a061" }

border_symbol = "│"
border_style  = { fg = "#2c2c2c" }

syntect_theme = ""

# : Tabs

[tabs]
active   = { fg = "#0b0b0b", bg = "#bdbdbd", bold = true }
inactive = { fg = "#858585", bg = "#0b0b0b" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# : Mode

[mode]
normal_main = { fg = "#0b0b0b", bg = "#bdbdbd", bold = true }
normal_alt  = { fg = "#bdbdbd", bg = "#0b0b0b" }

select_main = { fg = "#0b0b0b", bg = "#c46a6a", bold = true }
select_alt  = { fg = "#c46a6a", bg = "#0b0b0b" }

unset_main = { fg = "#0b0b0b", bg = "#c2a061", bold = true }
unset_alt  = { fg = "#c2a061", bg = "#0b0b0b" }

# : Indicator of hovered file

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "", close = "" }

# : Status bar

[status]
overall   = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep   = { fg = "#2c2c2c" }
perm_type  = { fg = "#bdbdbd" }
perm_read  = { fg = "#e6e6e6" }
perm_write = { fg = "#c46a6a" }
perm_exec  = { fg = "#7fa8a3" }

progress_label  = { bold = true }
progress_normal = { fg = "#bdbdbd", bg = "#0b0b0b" }
progress_error  = { fg = "#c2a061", bg = "#c46a6a" }

# : Which

[which]
cols            = 3
mask            = { bg = "#0b0b0b" }
cand            = { fg = "#bdbdbd" }
rest            = { fg = "#2c2c2c" }
desc            = { fg = "#a08aad" }
separator       = "  "
separator_style = { fg = "#2c2c2c" }

# : Confirmation

[confirm]
border     = { fg = "#bdbdbd" }
title      = { fg = "#bdbdbd" }
body       = {}
list       = {}
btn_yes    = { reversed = true }
btn_no     = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

# : Spotter

[spot]
border = { fg = "#bdbdbd" }
title  = { fg = "#bdbdbd" }

tbl_col  = { fg = "#e6e6e6" }
tbl_cell = { fg = "#c2a061", reversed = true }

# : Notification

[notify]
title_info  = { fg = "#bdbdbd" }
title_warn  = { fg = "#c2a061" }
title_error = { fg = "#c46a6a" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

# : Picker

[pick]
border   = { fg = "#bdbdbd" }
active   = { fg = "#e6e6e6", bold = true }
inactive = {}

# : Input

[input]
border   = { fg = "#bdbdbd" }
title    = {}
value    = {}
selected = { reversed = true }

# : Completion

[cmp]
border   = { fg = "#bdbdbd" }
active   = { reversed = true }
inactive = {}

icon_file    = ""
icon_folder  = ""
icon_command = ""

# : Task manager

[tasks]
border  = { fg = "#bdbdbd" }
title   = {}
hovered = { fg = "#e6e6e6", bold = true }

# : Help menu

[help]
on      = { fg = "#7fa8a3" }
run     = { fg = "#a08aad" }
desc    = {}
hovered = { reversed = true, bold = true }
footer  = { fg = "#0b0b0b", bg = "#bdbdbd" }

# : File-specific styles (broad mime groups only — see note at top)

[filetype]
rules = [
	{ mime = "image/*", fg = "#a08aad" },
	{ mime = "{audio,video}/*", fg = "#a08aad" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c46a6a" },
	{ mime = "application/{pdf,doc,rtf}", fg = "#7fa8a3" },
	{ mime = "vfs/{absent,stale}", fg = "#5f5f5f" },
	{ url = "*", is = "orphan", bg = "#c46a6a" },
	{ url = "*", is = "exec"  , fg = "#bdbdbd" },
	{ url = "*", is = "dummy", bg = "#c46a6a" },
	{ url = "*/", is = "dummy", bg = "#c46a6a" },
	{ url = "*/", fg = "#bdbdbd" },
]
