# Runs install.sh --ci (the terminal profile) in a fresh container per
# supported distro: installs packages.txt, npm, the GitHub-release tools
# and mise — the parts that break when a distro renames or drops a
# package. Weekly as well as on changes, since the distros move even when
# this repo doesn't. The desktop profile's own CI is in ~/.rice.
name: install

on:
  push:
    paths:
      - install.sh
      - .bootstrap/**
      - .github/workflows/install.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        image:
          - fedora:latest
          - debian:trixie
          - ubuntu:24.04
          - archlinux:latest
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # the installer's own prerequisites (see preflight in install.sh)
      - name: prerequisites
        run: |
          if command -v dnf; then dnf install -y sudo git python3 curl
          elif command -v apt-get; then apt-get update && apt-get install -y sudo git python3 curl ca-certificates
          else pacman -Syu --noconfirm sudo git python curl
          fi

      - uses: actions/checkout@v4

      - name: install.sh --ci
        run: ./install.sh --ci
