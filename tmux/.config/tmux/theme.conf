# tmux colors (the fixed palette), sourced from tmux.conf.
set -g status-style "bg=#0b0b0b,fg=#bdbdbd"

set -g status-left-style "bg=#0b0b0b,fg=#bdbdbd"
set -g status-right-style "bg=#0b0b0b,fg=#e6e6e6"

setw -g window-status-style "bg=#0b0b0b,fg=#2c2c2c"
setw -g window-status-current-style "bg=#bdbdbd,fg=#0b0b0b,bold"
setw -g window-status-activity-style "bg=#0b0b0b,fg=#c46a6a"
setw -g window-status-bell-style "bg=#0b0b0b,fg=#c46a6a,bold"

set -g pane-border-style "fg=#1c1c1c"
set -g pane-active-border-style "fg=#bdbdbd"

set -g message-style "bg=#0b0b0b,fg=#bdbdbd"
set -g message-command-style "bg=#0b0b0b,fg=#e6e6e6"

set -g mode-style "bg=#bdbdbd,fg=#0b0b0b"

set -g display-panes-active-colour "#bdbdbd"
set -g display-panes-colour "#2c2c2c"

set -g clock-mode-colour "#bdbdbd"

# Palette for scripts/popups (tmux/.config/tmux/scripts/sessionizer.sh reads these)
set -g @color-black   "#0b0b0b"
set -g @color-surface "#161616"
set -g @color-fg      "#d0d0d0"
set -g @color-neon    "#bdbdbd"
set -g @color-acid    "#e6e6e6"
set -g @color-dim     "#2c2c2c"
set -g @color-deep    "#1c1c1c"
set -g @color-gray    "#5f5f5f"
set -g @color-red     "#c46a6a"
