# Run fish in panes without touching the login shell (chsh) — mirrors how
# foot/other terminals here launch fish directly instead of relying on $SHELL.
run-shell "tmux set-option -g default-shell \"$(command -v fish)\""

# The leader, in NORMAL mode. vim-modes takes this key over and then parks the
# option itself on None — see plugins/vim-modes/README.md — so set the key here
# rather than deleting the line if you want to change it.
set -g prefix Space

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g history-limit 50000
set -g focus-events on
set -sg terminal-overrides ",*:RGB"

# What foot (the outer terminal) can do, so tmux passes it through to the
# programs inside instead of quietly dropping it: true colour, the system
# clipboard over OSC 52, cursor colour and shape (nvim's bar in insert),
# curly/coloured underlines (diagnostics), hyperlinks, synchronized output,
# extended keys, focus events and the window title. Read when a client
# attaches, so detach and reattach after changing it.
set -as terminal-features ",foot*:RGB:clipboard:ccolour:cstyle:extkeys:focus:hyperlinks:overline:strikethrough:sync:title:usstyle"
# Ctrl+Enter, Shift+Enter, Ctrl+Shift+letter ... reach programs that ask for
# them (nvim, fish, claude), as CSI u like foot sends them.
set -s extended-keys on
set -s extended-keys-format csi-u
# A program inside (nvim over ssh, tmux-yank, OSC 52 tools) can set the
# system clipboard through tmux and foot.
set -s set-clipboard on
# Image previews (yazi's sixel) and other escape sequences meant for foot
# itself get through.
set -g allow-passthrough on
# foot's window title (sway's window switcher, the launcher's @): session · window
set -g set-titles on
set -g set-titles-string "#S · #W"

# stop programs (fish, various CLIs) auto-renaming windows behind your back
set -g allow-rename off

# handle multiple clients on the same session at different terminal sizes
# sanely (fit to the smallest *active* client's window, not just any client)
setw -g aggressive-resize on

# confirmation messages (e.g. "config reloaded") default to disappearing
# in 750ms — too fast to actually read
set -g display-time 2000

# Colors (theme.conf) — status bar / pane border / message colors
source-file ~/.config/tmux/theme.conf

# vim-modes prepends its NORMAL/VISUAL/INSERT indicator to this; its colors come
# from the @vim-modes-*-style options in theme.conf.
set -g status-left "#[fg=#{@color-acid}] ● #[fg=#{@color-fg},bold]#S#[default]#[fg=#{@color-dim}]  │ "
set -g status-left-length 60
set -g status-justify left

# Right side: persist marker (`p` in TMUX mode), git branch of the active pane's cwd (empty
# outside a repo), clock. Colors from the @color-* options (theme.conf).
set -g status-right "#{?@persist,#[fg=#{@color-acid}]❄ persist,#[fg=#{@color-dim}]· volatile}#[fg=#{@color-dim}]  │  #[fg=#{@color-neon}]#(git -C #{pane_current_path} branch --show-current 2>/dev/null | sed 's/^/⎇ /')#[fg=#{@color-dim}]  │  #[fg=#{@color-gray}]%H:%M "
set -g status-right-length 80
set -g status-interval 5

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# real system-clipboard yank (xclip/wl-copy/win32yank auto-detected —
# works across Ubuntu, Fedora and WSL) instead of only tmux's own buffer
set -g @plugin 'tmux-plugins/tmux-yank'

# Persistence across reboots: resurrect saves/restores sessions, continuum
# autosaves and restores on server start. Must load after status-right is set
# (continuum hooks into it for its autosave timer).
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'nvim'
# Only sessions marked @persist are saved (toggle: `p` in TMUX mode). Restored sessions are re-marked.
set -g @resurrect-hook-post-save-layout '~/.config/tmux/scripts/resurrect-filter.sh'
set -g @resurrect-hook-post-restore-all 'for s in $(tmux list-sessions -F "#{session_name}"); do tmux set -t "$s" @persist 1; done'

run '~/.tmux/plugins/tpm/tpm'

# Window/pane/session management lives on the direct Alt chords at the bottom;
# the leader (vim-modes) is for modes, hjkl and a few one-offs. Drop tmux's
# stock leader keys for the same jobs so they don't linger there.
unbind -T prefix c
unbind -T prefix n
unbind -T prefix p
unbind -T prefix l
unbind -T prefix w
unbind -T prefix x
unbind -T prefix &
unbind -T prefix z
unbind -T prefix ,
unbind -T prefix s
unbind -T prefix %
unbind -T prefix '"'
unbind -T prefix 0
unbind -T prefix 1
unbind -T prefix 2
unbind -T prefix 3
unbind -T prefix 4
unbind -T prefix 5
unbind -T prefix 6
unbind -T prefix 7
unbind -T prefix 8
unbind -T prefix 9

# Normal/Visual/Insert modes. Local plugin, not TPM-managed (nothing to fetch),
# but loaded like one — and deliberately *after* TPM, so where it and another
# plugin bind the same key (tmux-yank owns copy-mode's `y`), this one wins.
# See plugins/vim-modes/README.md for the mode model and the options below.
# Mode names by function: TMUX = tmux's own layer (keys don't reach the
# pane), SHELL = keys go to the pane, SCROLL = one pane's scrollback: browse, select, yank.
set -g @vim-modes-normal-text ' TMUX '
set -g @vim-modes-insert-text ' SHELL '
set -g @vim-modes-visual-text ' SCROLL '
run '~/.config/tmux/plugins/vim-modes/vim-modes.tmux'
# Escape always reaches the pane (ssh/vi, claude menus); Ctrl+Space leaves INSERT.
unbind -n Escape
# Space Space = leader twice: enter SHELL mode (replaces stock next-layout).
bind -T prefix Space switch-client -T root
unbind -T prefix i
unbind -T prefix v

# tmux-sessionizer: session/window/pane tree popup. Registers a `sessionizer`
# command alias (binds nothing itself), used below.
run '~/.config/tmux/plugins/tmux-sessionizer/sessionizer.tmux'

# Second layer: bare single keys in NORMAL (TMUX mode). NORMAL swallows every
# key, so no modifier is needed — they can't reach the pane, and leader is only
# for mode switches. Deliberately absent from SCROLL, whose keys are copy-mode's
# own (h/j/k/l/n/t/... move and search); leave it with Ctrl+Space first. Each
# ends in `vim-modes-return` (alias defined by vim-modes, hence this block
# living after its `run`). h/j/k/l pane focus and H/J/K/L resize are in
# vim-modes.conf.

# windows
bind -T vim-normal 1 select-window -t :1 \; vim-modes-return
bind -T vim-normal 2 select-window -t :2 \; vim-modes-return
bind -T vim-normal 3 select-window -t :3 \; vim-modes-return
bind -T vim-normal 4 select-window -t :4 \; vim-modes-return
bind -T vim-normal 5 select-window -t :5 \; vim-modes-return
bind -T vim-normal 6 select-window -t :6 \; vim-modes-return
bind -T vim-normal 7 select-window -t :7 \; vim-modes-return
bind -T vim-normal 8 select-window -t :8 \; vim-modes-return
bind -T vim-normal 9 select-window -t :$ \; vim-modes-return
bind -T vim-normal , previous-window \; vim-modes-return
bind -T vim-normal . next-window \; vim-modes-return
bind -T vim-normal Tab last-window \; vim-modes-return
bind -T vim-normal t new-window -c "#{pane_current_path}" \; vim-modes-return
bind -T vim-normal r command-prompt -I "#W" "rename-window '%%'" \; vim-modes-return
bind -T vim-normal W display-popup -E -w 62 -h 9 -b rounded -S "fg=#{?#{@color-red},#{@color-red},red}" -T " kill window " "$HOME/.config/tmux/scripts/confirm-kill.sh window" \; vim-modes-return
bind -T vim-normal < swap-window -t :-1 \; select-window -t :-1 \; vim-modes-return
bind -T vim-normal > swap-window -t :+1 \; select-window -t :+1 \; vim-modes-return

# panes
bind -T vim-normal n if -F "#{>:#{pane_width},#{e|*:2,#{pane_height}}}" 'split-window -h -c "#{pane_current_path}"' 'split-window -v -c "#{pane_current_path}"' \; vim-modes-return
bind -T vim-normal \\ split-window -h -c "#{pane_current_path}" \; vim-modes-return
bind -T vim-normal - split-window -v -c "#{pane_current_path}" \; vim-modes-return
bind -T vim-normal w display-popup -E -w 62 -h 9 -b rounded -S "fg=#{?#{@color-red},#{@color-red},red}" -T " kill pane " "$HOME/.config/tmux/scripts/confirm-kill.sh pane" \; vim-modes-return
bind -T vim-normal f resize-pane -Z \; vim-modes-return

# scroll — enter SCROLL (copy-mode); doesn't re-arm NORMAL, copy-mode needs the root table
bind -T vim-normal v copy-mode

# sessions
bind -T vim-normal s sessionizer \; vim-modes-return
bind -T vim-normal p if -F '#{@persist}' 'set @persist 0 ; display "persist: off"' 'set @persist 1 ; display "persist: on"' \; vim-modes-return
bind -T vim-normal S switch-client -l \; vim-modes-return

# Ctrl+click opens the URL under the pointer (OSC 8 link, or plain text found
# in the clicked row). Mouse, not a chord, so it's bound in INSERT too. A plain
# click stays with tmux (focus/select). Terminal-side Ctrl+Shift+click never
# reaches a program that has the mouse, hence this.
bind -n C-MouseDown1Pane run-shell -b "$HOME/.config/tmux/scripts/open-url.sh h#{q:mouse_hyperlink} l#{q:mouse_line} x#{mouse_x}"
bind -T vim-normal C-MouseDown1Pane run-shell -b "$HOME/.config/tmux/scripts/open-url.sh h#{q:mouse_hyperlink} l#{q:mouse_line} x#{mouse_x}" \; vim-modes-return
bind -T copy-mode-vi C-MouseDown1Pane run-shell -b "$HOME/.config/tmux/scripts/open-url.sh h#{q:mouse_hyperlink} l#{q:mouse_line} x#{mouse_x}"

# let the server pick up the Wayland session from whichever client attaches
# (TERM/TERM_PROGRAM: yazi picks its image protocol from the outer terminal)
set -ga update-environment " WAYLAND_DISPLAY SWAYSOCK TERM TERM_PROGRAM"

# When this file was last (re)loaded, so `install.sh --doctor` can tell a
# server still running an older tmux.conf/theme than the one on disk.
run-shell 'tmux set -g @dots-loaded "$(date +%s)"'
